<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes</title>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; max-width: 640px; margin: 0 auto; padding: 24px; }
  h1 { margin-bottom: 20px; }
  .form { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .form input, .form textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px; font: inherit; }
  .form textarea { height: 80px; resize: vertical; }
  .form button { padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font: inherit; }
  .form button:hover { background: #1d4ed8; }
  .form .cancel { background: #888; margin-left: 8px; }
  .note { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .note h3 { margin-bottom: 6px; }
  .note p { color: #555; white-space: pre-wrap; margin-bottom: 8px; }
  .note small { color: #999; }
  .note .actions { margin-top: 8px; }
  .note .actions button { padding: 4px 12px; margin-right: 6px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .edit-btn { background: #f59e0b; color: #fff; }
  .del-btn { background: #ef4444; color: #fff; }
  .empty { color: #999; text-align: center; padding: 40px; }
</style>
</head>
<body>

<h1>Notes</h1>

<div class="form" id="form-area">
  <form hx-post="/notes" hx-target="#list" hx-swap="innerHTML" hx-on::after-request="this.reset()">
    <input name="title" placeholder="Title" required />
    <textarea name="content" placeholder="Content" required></textarea>
    <button type="submit">Save</button>
  </form>
</div>

<div id="list" hx-get="/notes" hx-trigger="load" hx-swap="innerHTML"></div>

</body>
</html>
